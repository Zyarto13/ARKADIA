name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Arkadia.sln
      - name: Build
        run: dotnet build Arkadia.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Arkadia.sln --configuration Release --no-build
